services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6334:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build:
      context: .
      args:
        GIT_REVISION: ${GIT_REVISION:-unknown}
    depends_on:
      - qdrant
    network_mode: host
    env_file:
      - .env
    environment:
      QDRANT_URL: http://127.0.0.1:6334
      OLLAMA_URL: http://127.0.0.1:11434
      LANGFUSE_BASE_URL: http://127.0.0.1:28420
      EXPERIMENT_DATA_DIR: /data
      FRONTEND_RATE_LIMIT_ENABLED: "true"
      CORPUS_DIR: /corpus
      HF_HOME: /model-cache
    command: ["uvicorn", "main:app", "--app-dir", "app", "--host", "127.0.0.1", "--port", "8001"]
    volumes:
      - ./corpus:/corpus:ro
      - ./data:/data
      - model_cache:/model-cache

  frontend:
    build:
      context: ./frontend
    depends_on:
      - app
    network_mode: host
    env_file:
      - .env
    environment:
      FRONTEND_PORT: 43179
      FRONTEND_HOST: 127.0.0.1
      TRUST_CLOUDFLARE_PROXY: "true"
      COOKIE_SECURE: "true"
      RAG_API_URL: http://127.0.0.1:8001
      LANGFUSE_BASE_URL: http://127.0.0.1:28420
      LANGFUSE_UI_URL: http://127.0.0.1:28420
      LANGFUSE_PROJECT_ID: millenium

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflare]
    depends_on:
      - frontend
    network_mode: host
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_PRODUCTION_TUNNEL_TOKEN:-}
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qdrant_data:
  model_cache:
