services:
  redis:
    image: redis:8.2.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_cache_data:/data

  qdrant:
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    ports:
      - "6334:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build:
      context: .
      args:
        GIT_REVISION: ${GIT_REVISION:-unknown}
    depends_on:
      - qdrant
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      QDRANT_URL: http://127.0.0.1:6334
      OLLAMA_URL: http://127.0.0.1:11434
      CODEX_JUDGE_URL: http://127.0.0.1:4097
      LANGFUSE_BASE_URL: http://127.0.0.1:28420
      EXPERIMENT_DATA_DIR: /data
      ANSWER_CACHE_REDIS_URL: redis://127.0.0.1:6379/0
      FRONTEND_RATE_LIMIT_ENABLED: "true"
      CORPUS_ID: millennium
      CORPUS_ROOT: /corpora/millennium
      HF_HOME: /model-cache
    command: ["uvicorn", "main:app", "--app-dir", "app", "--host", "127.0.0.1", "--port", "8001"]
    volumes:
      - ./corpora/millennium:/corpora/millennium:ro
      - ./data:/data
      - model_cache:/model-cache

  frontend:
    build:
      context: ./frontends/millennium
    depends_on:
      - app
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      FRONTEND_PORT: 43179
      FRONTEND_HOST: 127.0.0.1
      TRUST_CLOUDFLARE_PROXY: "true"
      COOKIE_SECURE: "true"
      RAG_API_URL: http://127.0.0.1:8001
      LANGFUSE_BASE_URL: http://127.0.0.1:28420
      LANGFUSE_UI_URL: http://127.0.0.1:28420
      LANGFUSE_PROJECT_ID: millenium

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflare]
    depends_on:
      - frontend
    network_mode: host
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_PRODUCTION_TUNNEL_TOKEN:-}
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_cache_data:
  qdrant_data:
  model_cache:
