<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-book-inspired-title pipeline-book-inspired-desc" id="pipeline-book-inspired-root">
<title id="pipeline-book-inspired-title">Pipeline v2.12 · From question to cited answer</title>
<desc id="pipeline-book-inspired-desc">A five-stage view of the v2.12 agent pipeline, its model roles, grouped query expansion outputs, retrieval and reading tools, evidence reranking, safeguards, and technologies.</desc>
<defs>
<style>
#pipeline-book-inspired-root { color:#231f25; font-family:'Geist',system-ui,sans-serif; }
#pipeline-book-inspired-root .zone { fill:rgba(35,31,37,.025); stroke:rgba(35,31,37,.18); stroke-width:1; }
#pipeline-book-inspired-root .model { fill:#f3eee4; stroke:#beb0ad; stroke-width:1.2; }
#pipeline-book-inspired-root .model-main { fill:#f3eee4; stroke:#beb0ad; stroke-width:1.2; }
#pipeline-book-inspired-root .chip { fill:#f3eee4; stroke:#beb0ad; stroke-width:1; }
#pipeline-book-inspired-root .chip-accent { fill:#f3eee4; stroke:#beb0ad; stroke-width:1; }
#pipeline-book-inspired-root .chip-focal { fill:#f3eee4; stroke:#beb0ad; stroke-width:1; }
#pipeline-book-inspired-root .zone-label { font:500 9px 'Geist Mono',ui-monospace,monospace; letter-spacing:.1em; fill:#51494f; }
#pipeline-book-inspired-root .tag { font:500 8px 'Geist Mono',ui-monospace,monospace; letter-spacing:.1em; fill:#51494f; }
#pipeline-book-inspired-root .name { font:600 12px 'Geist',system-ui,sans-serif; fill:#231f25; }
#pipeline-book-inspired-root .detail { font:400 9px 'Geist Mono',ui-monospace,monospace; fill:#4d454b; }
#pipeline-book-inspired-root .detail-ink { font:400 9px 'Geist Mono',ui-monospace,monospace; fill:#231f25; }
#pipeline-book-inspired-root .model-name { font:600 10px 'Geist Mono',ui-monospace,monospace; fill:#231f25; }
#pipeline-book-inspired-root .link { fill:none; stroke:#655d63; stroke-width:1.4; marker-end:url(#pipeline-book-inspired-arrow); }
#pipeline-book-inspired-root .link-focal { fill:none; stroke:#8c3547; stroke-width:1.6; marker-end:url(#pipeline-book-inspired-arrow-accent); }
#pipeline-book-inspired-root .signature { font:600 11px 'Geist Mono',ui-monospace,monospace; letter-spacing:.1em; fill:#f3eee4; }
</style>
<marker id="pipeline-book-inspired-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#655d63"/></marker>
<marker id="pipeline-book-inspired-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#8c3547"/></marker>
</defs>
<rect width="1280" height="760" fill="#f3eee4"/>
<text x="32" y="38" class="zone-label">OPTIMIZED FOR MILLENNIUM SERIES</text>
<rect x="1112" y="16" width="136" height="32" rx="4" fill="#8c3547"/><text x="1124" y="37" class="signature">PIPELINE V2.12</text>
<text x="32" y="76" style="font:400 30px 'Instrument Serif',Georgia,serif;fill:#231f25">Agentic RAG for novels</text>
<text x="32" y="100" class="detail">For corpora longer than 200,000 tokens</text>
<!-- Model ribbon: each model is tied to its pipeline role -->
<g aria-label="Models used" transform="translate(0 -24)">
<rect class="model" x="272" y="588" width="236" height="72" rx="5"/><text class="tag" x="288" y="607">QUERY TRANSFORMS · OLLAMA</text><text class="model-name" x="288" y="627">qwen3:8b</text><text class="detail" x="288" y="645">HyDE · alternatives · grammar</text>
<rect class="model" x="520" y="504" width="236" height="72" rx="5"/><text class="tag" x="536" y="523">EMBEDDING MODEL</text><rect class="chip" x="690" y="511" width="42" height="16" rx="3" style="fill:#e6eef3;stroke:#607d8b"/><text class="tag" x="695" y="523" style="fill:#355568">INDEX</text><text class="model-name" x="536" y="541">multi-qa-MiniLM-L6-cos-v1</text><text class="detail" x="536" y="561">SentenceTransformers</text>
<rect class="model" x="768" y="588" width="236" height="72" rx="5"/><text class="tag" x="784" y="607">RERANKER MODEL</text><text class="model-name" x="784" y="627">ms-marco-MiniLM-L-6-v2</text><text class="detail" x="784" y="645">CrossEncoder · query-aware</text>
<rect class="model" x="520" y="588" width="236" height="72" rx="5"/><text class="tag" x="536" y="607">SCENE SUMMARY MODEL</text><rect class="chip" x="698" y="595" width="42" height="16" rx="3" style="fill:#e6eef3;stroke:#607d8b"/><text class="tag" x="703" y="607" style="fill:#355568">INDEX</text><text class="model-name" x="536" y="627">gemma4:26b</text><text class="detail" x="536" y="645">Ollama · scene summaries</text>
</g>
<g transform="translate(0 -96)">
<!-- Five stage zones: expansion and search are separate stages. -->
<rect class="zone" x="24" y="300" width="236" height="432" rx="7"/><rect class="zone" x="272" y="300" width="236" height="348" rx="7"/><rect class="zone" x="520" y="300" width="236" height="264" rx="7"/><rect class="zone" x="768" y="300" width="236" height="348" rx="7"/><rect class="zone" x="1016" y="300" width="240" height="432" rx="7"/>
<text class="zone-label" x="40" y="323">01 · UNDERSTAND</text><text class="zone-label" x="288" y="323">02 · QUERY EXPANSION</text><text class="zone-label" x="536" y="323">03 · SEARCH TOOLS</text><text class="zone-label" x="784" y="323">04 · READ &amp; RERANK</text><text class="zone-label" x="1032" y="323">05 · ANSWER</text><text class="name" x="288" y="362">Query Expansion</text><text class="name" x="536" y="362">Search Tools</text>
<rect class="model-main" x="272" y="216" width="984" height="72" rx="5"/><text class="tag" x="764" y="235" text-anchor="middle">AGENT MODEL · OLLAMA / OPENAI</text><text class="model-name" x="764" y="255" text-anchor="middle">qwen3.6:35b</text><text class="detail" x="764" y="273" text-anchor="middle">plans tools · synthesizes answer</text>
<path class="link-focal" d="M390 288 V298"/><path class="link-focal" d="M638 288 V298"/><path class="link-focal" d="M886 288 V298"/><path class="link-focal" d="M1136 288 V298"/>
<!-- Main flow, aligned at a shared centerline -->
<path class="link" d="M260 432 H272"/><path class="link" d="M508 432 H520"/><path class="link" d="M756 432 H768"/><path class="link-focal" d="M1004 432 H1016"/>
<!-- Stage 1 -->
<g transform="translate(0 84)">
<text class="name" x="40" y="278">Question Analysis &amp; Prechecks</text>
<rect class="chip" x="40" y="296" width="204" height="46" rx="4"/><text class="tag" x="52" y="311">CONNECTION</text><text class="detail" x="52" y="327">Entity card index</text>
<rect class="chip" x="40" y="348" width="204" height="54" rx="4"/><text class="tag" x="52" y="363">INITIAL SCENE PROBE</text><text class="detail" x="52" y="379">SentenceTransformers</text><text class="detail" x="52" y="392">Qdrant scene summary index</text>
<rect class="chip" x="40" y="408" width="204" height="64" rx="4"/><text class="tag" x="52" y="423">TRUE ACCOUNT CHECKS</text><text class="detail" x="52" y="439">Entity card clues</text><text class="detail" x="52" y="452">Semantic passage search</text><text class="detail" x="52" y="465">Qdrant scene summary index</text>
<rect class="chip" x="40" y="478" width="204" height="46" rx="4"/><text class="tag" x="52" y="493">SEQUENCE CHECK</text><text class="detail" x="52" y="509">Scene summaries</text>
<rect class="chip" x="40" y="530" width="204" height="54" rx="4"/><text class="tag" x="52" y="545">MOMENT CHECK</text><text class="detail" x="52" y="561">Scene summaries</text><text class="detail" x="52" y="574">BM25</text>
<rect class="chip" x="40" y="590" width="204" height="46" rx="4"/><text class="tag" x="52" y="605">PREMISE PROBE</text><text class="detail" x="52" y="621">survival evidence · early stop off</text>

</g>
<!-- Stage 2: sibling output chips, deliberately labeled as outputs rather than concurrent execution -->
<rect class="chip" x="288" y="385" width="92" height="42" rx="5"/><text class="tag" x="300" y="403">HYDE</text><text class="detail" x="300" y="419">passage</text>
<rect class="chip" x="388" y="385" width="104" height="42" rx="5"/><text class="tag" x="400" y="403">ALTERNATIVES</text><text class="detail" x="400" y="419">3 queries</text>
<rect class="chip" x="288" y="437" width="204" height="42" rx="5"/><text class="tag" x="390" y="461" text-anchor="middle">GRAMMAR-CORRECTED QUERY</text>

<!-- Stage 3 -->

<rect class="chip" x="536" y="380" width="98" height="32" rx="4"/><text class="detail-ink" x="547" y="400">semantic</text><rect class="chip" x="642" y="380" width="98" height="32" rx="4"/><text class="detail-ink" x="653" y="400">keyword</text>
<rect class="chip" x="536" y="420" width="98" height="32" rx="4"/><text class="detail-ink" x="547" y="440">scenes</text><rect class="chip" x="642" y="420" width="98" height="32" rx="4"/><text class="detail-ink" x="653" y="440">true account</text>
<rect class="chip" x="536" y="460" width="98" height="32" rx="4"/><text class="detail-ink" x="547" y="480">names</text><rect class="chip" x="642" y="460" width="98" height="32" rx="4"/><text class="detail-ink" x="653" y="480">connections</text>
<rect class="chip" x="536" y="500" width="204" height="32" rx="4"/><text class="detail-ink" x="547" y="520">scene moments · entity cards</text>

<!-- Stage 4 -->
<text class="name" x="784" y="362">Read and select evidence</text>
<rect class="chip" x="784" y="380" width="204" height="32" rx="4"/><text class="detail-ink" x="796" y="400">read scene · passage · chapter</text>
<rect class="chip-accent" x="784" y="430" width="204" height="54" rx="4"/><text class="tag" x="796" y="448">QUERY-AWARE RERANK</text><text class="detail-ink" x="796" y="466">question + retrieval query</text>

<!-- Stage 5 -->
<text class="name" x="1032" y="362">Synthesis safeguards</text>
<rect class="chip" x="1032" y="380" width="208" height="44" rx="4"/><text class="tag" x="1044" y="396">CHECK SUBMISSION</text><text class="detail" x="1044" y="414">IDs · minimum calls · coverage</text>
<rect class="chip" x="1032" y="429" width="208" height="44" rx="4"/><text class="tag" x="1044" y="445">VERIFY SUPPORT</text><text class="detail" x="1044" y="463">Passages support answer claims</text>
<rect class="chip" x="1032" y="478" width="208" height="44" rx="4"/><text class="tag" x="1044" y="494">CHECK SEQUENCE</text><text class="detail" x="1044" y="512">Complete missing event stages</text>
<rect class="chip" x="1032" y="527" width="208" height="44" rx="4"/><text class="tag" x="1044" y="543">RECOVER IF NEEDED</text><text class="detail" x="1044" y="561">Synthesize evidence or abstain</text>
<rect class="chip" x="1032" y="576" width="208" height="44" rx="4"/><text class="tag" x="1044" y="592">FORMAT CITATIONS</text><text class="detail" x="1044" y="610">Convert IDs to [E1], [E2]…</text>
<rect class="chip-focal" x="1032" y="625" width="208" height="44" rx="4"/><text class="tag" x="1044" y="641">FINAL ANSWER</text><text class="detail-ink" x="1044" y="659">Answer with citations or abstain</text>

</g>
</svg>
